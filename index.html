<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Ganhos</title>
  <style>
    :root {
      --primary-color: #0284c7;
      --bg-color: #f0f9ff;
      --card-bg: #ffffff;
      --text-color: #1e293b;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      color: var(--primary-color);
      margin-bottom: 24px;
      font-size: 24px;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin-top: 20px;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 2px solid #e2e8f0;
      color: #0369a1;
    }

    .input-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    label {
      font-size: 15px;
      font-weight: 500;
    }

    input[type="number"] {
      width: 80px;
      padding: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 16px;
      text-align: center;
    }

    .results {
      margin-top: 28px;
      background-color: #f8fafc;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 16px;
    }

    .result-item.total {
      font-weight: bold;
      font-size: 20px;
      color: var(--primary-color);
      border-top: 2px dashed #cbd5e1;
      padding-top: 10px;
      margin-top: 10px;
    }

    .price-tag {
      font-size: 12px;
      color: #64748b;
    }

    .btn-reset {
      width: 100%;
      margin-top: 16px;
      padding: 10px;
      background-color: #ef4444;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-reset:active {
      background-color: #dc2626;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Controle de Ganhos</h1>

    <!-- SEÇÃO GERAL / KITE -->
    <div class="section-title">Geral & Kite</div>
    
    <div class="input-group">
      <label for="diarias">Diárias <span class="price-tag">(R$ 80,00)</span></label>
      <input type="number" id="diarias" min="0" value="0" oninput="salvarECalcular()">
    </div>

    <div class="input-group">
      <label for="assistenciaGeral">Assistência (1h) <span class="price-tag">(R$ 50,00)</span></label>
      <input type="number" id="assistenciaGeral" min="0" value="0" oninput="salvarECalcular()">
    </div>

    <!-- SEÇÃO WING -->
    <div class="section-title">Wing</div>

    <div class="input-group">
      <label for="aulasWing">Aula Wing (2h) <span class="price-tag">(R$ 225,00)</span></label>
      <input type="number" id="aulasWing" min="0" value="0" oninput="salvarECalcular()">
    </div>

    <div class="input-group">
      <label for="assistenciaWing">Assistência Wing (2h) <span class="price-tag">(R$ 195,00)</span></label>
      <input type="number" id="assistenciaWing" min="0" value="0" oninput="salvarECalcular()">
    </div>

    <!-- RESUMO DE VALORES -->
    <div class="results">
      <div class="result-item">
        <span>Total Geral/Kite:</span>
        <span id="subtotalGeral">R$ 0,00</span>
      </div>
      <div class="result-item">
        <span>Total Wing:</span>
        <span id="subtotalWing">R$ 0,00</span>
      </div>
      <div class="result-item total">
        <span>Total Final:</span>
        <span id="totalFinal">R$ 0,00</span>
      </div>
    </div>

    <button class="btn-reset" onclick="zerarTudo()">Zerar Valores</button>
  </div>

  <script>
    // Carregar dados salvos assim que a página abre
    window.onload = function() {
      if (localStorage.getItem('diarias')) document.getElementById('diarias').value = localStorage.getItem('diarias');
      if (localStorage.getItem('assistenciaGeral')) document.getElementById('assistenciaGeral').value = localStorage.getItem('assistenciaGeral');
      if (localStorage.getItem('aulasWing')) document.getElementById('aulasWing').value = localStorage.getItem('aulasWing');
      if (localStorage.getItem('assistenciaWing')) document.getElementById('assistenciaWing').value = localStorage.getItem('assistenciaWing');
      
      calcularTotal();
    };

    function salvarECalcular() {
      // Salva os valores no navegador
      localStorage.setItem('diarias', document.getElementById('diarias').value);
      localStorage.setItem('assistenciaGeral', document.getElementById('assistenciaGeral').value);
      localStorage.setItem('aulasWing', document.getElementById('aulasWing').value);
      localStorage.setItem('assistenciaWing', document.getElementById('assistenciaWing').value);

      calcularTotal();
    }

    function calcularTotal() {
      const VALOR_DIARIA = 80;
      const VALOR_ASSISTENCIA_GERAL = 50;
      const VALOR_AULA_WING = 225;
      const VALOR_ASSISTENCIA_WING = 195;

      const qtdDiarias = Number(document.getElementById('diarias').value) || 0;
      const qtdAssistGeral = Number(document.getElementById('assistenciaGeral').value) || 0;
      const qtdAulasWing = Number(document.getElementById('aulasWing').value) || 0;
      const qtdAssistWing = Number(document.getElementById('assistenciaWing').value) || 0;

      const subtotalGeral = (qtdDiarias * VALOR_DIARIA) + (qtdAssistGeral * VALOR_ASSISTENCIA_GERAL);
      const subtotalWing = (qtdAulasWing * VALOR_AULA_WING) + (qtdAssistWing * VALOR_ASSISTENCIA_WING);
      const totalFinal = subtotalGeral + subtotalWing;

      document.getElementById('subtotalGeral').innerText = subtotalGeral.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      document.getElementById('subtotalWing').innerText = subtotalWing.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      document.getElementById('totalFinal').innerText = totalFinal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function zerarTudo() {
      if (confirm("Deseja zerar todos os campos?")) {
        localStorage.clear();
        document.getElementById('diarias').value = 0;
        document.getElementById('assistenciaGeral').value = 0;
        document.getElementById('aulasWing').value = 0;
        document.getElementById('assistenciaWing').value = 0;
        calcularTotal();
      }
    }
  </script>

</body>
</html>
